{% comment %} Project Overwatch interactive scenario flowcharts. Native SVG, zero external diagram library. {% endcomment %}
<style>
.flow-svg{display:block;min-width:960px;width:100%;height:auto}
.flow-viewport{overflow-x:auto;padding:18px}
.flow-viewer{position:relative;border:1px solid #26334f;border-radius:18px;background:#070c16;overflow:hidden}
.flow-label{fill:#e6edf7;font-family:Inter,sans-serif}
.flow-edge-label{fill:#94a3b8;font-size:10px;font-weight:700;letter-spacing:.06em;font-family:Inter,sans-serif}
.flow-scenario-title{fill:#f1f5f9;font:800 16px Inter,sans-serif}
.flow-scenario-kicker{fill:#94a3b8;font:10px 'Fira Code',monospace;letter-spacing:.12em}
.flow-scenario-desc{fill:#a8b5c8;font:11.5px Inter,sans-serif}
.flow-node{cursor:pointer}
.flow-node:hover .flow-node-box{stroke-width:2.5;filter:brightness(1.12)}
.flow-node:focus{outline:none}
.flow-node:focus-visible .flow-node-box{outline:2px solid #60a5fa;outline-offset:3px}
</style>
